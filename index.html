<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xe Ôm Trường Lê - Bản Vệ Tinh VIP</title>
    
    <!-- Nhúng thư viện bản đồ Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');
        
        body { 
            font-family: 'Quicksand', sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); 
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; 
            justify-content: center; 
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }

        /* HIỆU ỨNG HOA ĐÀO RƠI */
        .petal {
            position: absolute;
            top: -10px;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite, sway ease-in-out infinite alternate;
            z-index: 9999;
        }
        @keyframes fall { to { top: 110vh; } }
        @keyframes sway { from { transform: translateX(-20px) rotate(0deg); } to { transform: translateX(20px) rotate(360deg); } }

        /* KHUNG ỨNG DỤNG ĐIỆN THOẠI */
        .mobile-frame { 
            width: 100%; 
            max-width: 420px; 
            background: #fff; 
            height: 100vh; 
            display: none; 
            flex-direction: column; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            position: relative;
            z-index: 100;
            overflow: hidden;
        }

        .header {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: #00C9FF;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            z-index: 10;
            border-bottom: 2px solid #00C9FF;
        }
        .header span { font-size: 12px; display: block; font-weight: 500; color: #fff; }

        #map { flex: 1; width: 100%; z-index: 1; }

        /* BẢNG ĐẶT XE */
        .booking-panel { 
            position: absolute; 
            bottom: 0; 
            width: 100%; 
            background: rgba(25, 25, 35, 0.9); 
            backdrop-filter: blur(15px);
            padding: 25px 20px; 
            border-top: 2px solid #00C9FF;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            box-sizing: border-box;
            z-index: 10; 
            color: white;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #00C9FF; margin-bottom: 8px;}
        .input-group select { 
            width: 100%; padding: 12px; 
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid #00C9FF; border-radius: 12px; 
            font-size: 15px; font-family: 'Quicksand'; outline: none;
        }
        .input-group select option { background: #1a1a2e; color: white; }

        .price-box { 
            display: none; 
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 15px; border-radius: 15px; margin-bottom: 15px; text-align: center; 
            color: #fff; box-shadow: 0 4px 15px rgba(56,239,125,0.4);
        }
        .price-box p { margin: 0; font-size: 16px; font-weight: 700; }
        .price-text { font-size: 28px; font-weight: 700; margin-top: 5px; }

        .btn-book { 
            width: 100%; padding: 16px; 
            background: linear-gradient(90deg, #FF416C 0%, #FF4B2B 100%); 
            color: white; border: none; border-radius: 12px; 
            font-size: 18px; font-weight: 700; cursor: pointer; 
            box-shadow: 0 5px 15px rgba(255,65,108,0.4);
        }

        /* NÚT ZALO HỖ TRỢ BÊN GÓC PHẢI */
        .zalo-btn {
            position: absolute;
            bottom: 25px;
            right: 15px;
            width: 50px;
            height: 50px;
            background-color: #0068FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 14px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 104, 255, 0.5);
            z-index: 1000;
            animation: pulseZalo 2s infinite;
        }
        @keyframes pulseZalo {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 104, 255, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(0, 104, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 104, 255, 0); }
        }

        /* HIỆU ỨNG CÁ SẤU ĐỚP CÁ */
        #crocAnimScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            display: none;
        }
        #animFish {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            animation: fishDangle 0.5s infinite alternate;
        }
        @keyframes fishDangle { from {transform: translateX(-50%) rotate(-10deg);} to {transform: translateX(-50%) rotate(10deg);} }
        #animCroc {
            position: absolute;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 100px;
            transition: bottom 0.3s ease-in;
        }

        /* MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ */
        .auth-container {
            width: 100%; max-width: 380px; margin: auto;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px);
            padding: 30px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
            z-index: 100; color: white; box-sizing: border-box;
        }
        .auth-header { text-align: center; font-size: 26px; font-weight: 700; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .auth-tabs { display: flex; margin-bottom: 20px; border-radius: 10px; overflow: hidden; background: rgba(0,0,0,0.2); }
        .auth-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .auth-tab.active { background: #00C9FF; color: #000; }
        
        .auth-form input {
            width: 100%; padding: 14px; margin-bottom: 15px;
            background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px; color: white; font-size: 16px; box-sizing: border-box; outline: none;
        }
        .btn-auth {
            width: 100%; padding: 15px; background: #00C9FF; color: #000; border: none;
            border-radius: 10px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,201,255,0.4);
        }
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div class="auth-container" id="authScreen">
        <div class="auth-header">🚀 TÀI XẾ TRƯỜNG LÊ</div>
        <div class="auth-tabs">
            <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Đăng Nhập</div>
            <div class="auth-tab" id="tabRegister" onclick="switchTab('register')">Đăng Ký</div>
        </div>

        <div class="auth-form" id="formLogin">
            <input type="tel" id="loginPhone" placeholder="Số điện thoại" value="0987654321">
            <input type="password" id="loginPass" placeholder="Mật khẩu" value="123456">
            <button class="btn-auth" onclick="doLogin()">VÀO APP NGAY</button>
        </div>

        <div class="auth-form" id="formRegister" style="display: none;">
            <input type="text" id="regName" placeholder="Họ và tên">
            <input type="tel" id="regPhone" placeholder="Số điện thoại">
            <!-- Khu vực nhập mã OTP -->
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="regOTP" placeholder="Mã xác nhận" style="margin-bottom: 0; flex: 1;">
                <button id="btnOTP" style="background: #FF416C; color: white; border: none; border-radius: 10px; padding: 0 15px; font-weight: bold; cursor: pointer; transition: 0.3s;" onclick="sendOTP()">Gửi mã</button>
            </div>
            <input type="password" id="regPass" placeholder="Mật khẩu">
            <button class="btn-auth" onclick="doRegister()">TẠO TÀI KHOẢN</button>
        </div>
    </div>

    <!-- MÀN HÌNH APP CHÍNH -->
    <div class="mobile-frame" id="mainApp">
        <div class="header">
            🚀 BẢN ĐỒ VỆ TINH VIP
            <span>Chủ sở hữu: Lê Văn Trường</span>
        </div>

        <div id="map"></div>

        <!-- Khung hoạt ảnh cá sấu đớp mồi -->
        <div id="crocAnimScreen">
            <div id="animFish">🐟</div>
            <div id="animCroc">🐊</div>
        </div>

        <!-- Nút liên kết Zalo hỗ trợ -->
        <a href="https://zaloapp.com/qr/p/qc0rgkdipkkf" target="_blank" class="zalo-btn">Zalo</a>

        <div class="booking-panel" id="bookingPanel">
            <div class="input-group">
                <label>📍 Chọn điểm đón:</label>
                <select id="pickup" onchange="calculateRoute()">
                    <option value="">-- Chạm để chọn điểm đón --</option>
                    <option value="gps" style="color: #00C9FF; font-weight: bold;">🛰️ Vị trí hiện tại của bạn</option>
                    <option value="21.0028,105.5244">🏢 Kí túc xá B-C</option>
                    <option value="21.0050,105.5230">🎓 Trường Đại học Việt Nhật - Xã Hòa Lạc</option>
                    <option value="20.9900,105.5280">⛽ Cây xăng 239</option>
                    <option value="21.0045,105.5255">🏨 Nhà khách</option>
                    <option value="21.0060,105.5260">📚 Giảng đường HT1</option>
                    <option value="21.0062,105.5265">📚 Giảng đường HT2</option>
                    <option value="21.0064,105.5270">📚 Giảng đường HT3</option>
                    <option value="21.0066,105.5275">📚 Giảng đường HT4</option>
                    <option value="21.0040,105.5270">💻 Trường Đại học Công nghệ - xã Hòa Lạc</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>🏁 Chọn điểm đến:</label>
                <select id="dropoff" onchange="calculateRoute()">
                    <option value="">-- Chạm để chọn nơi đến --</option>
                    <option value="21.0028,105.5244">🏢 Kí túc xá B-C</option>
                    <option value="21.0050,105.5230">🎓 Trường Đại học Việt Nhật - Xã Hòa Lạc</option>
                    <option value="20.9900,105.5280">⛽ Cây xăng 239</option>
                    <option value="21.0045,105.5255">🏨 Nhà khách</option>
                    <option value="21.0060,105.5260">📚 Giảng đường HT1</option>
                    <option value="21.0062,105.5265">📚 Giảng đường HT2</option>
                    <option value="21.0064,105.5270">📚 Giảng đường HT3</option>
                    <option value="21.0066,105.5275">📚 Giảng đường HT4</option>
                    <option value="21.0040,105.5270">💻 Trường Đại học Công nghệ - xã Hòa Lạc</option>
                    <option value="21.0010,105.5200">🏛️ Cổng chính Đại học Quốc gia</option>
                    <option value="21.0015,105.5280">⛩️ Cổng phụ Đại học Quốc gia</option>
                </select>
            </div>

            <div id="info-box" class="price-box">
                <p>Khoảng cách: <span id="distance-km">0</span> km</p>
                <div class="price-text" id="fare-price">0 đ</div>
            </div>

            <button class="btn-book" id="btnBook" onclick="triggerCrocAnimation()" style="display: none;">ĐẶT XE NGAY</button>
        </div>
    </div>

    <script>
        // --- 1. HOA ĐÀO RƠI ---
        function createPetals() {
            const petal = document.createElement('div');
            petal.innerHTML = '🌸';
            petal.classList.add('petal');
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = (Math.random() * 3 + 4) + 's, ' + (Math.random() * 2 + 1) + 's';
            document.body.appendChild(petal);
            setTimeout(() => { petal.remove(); }, 7000);
        }
        setInterval(createPetals, 300);

        // --- 2. LOGIC ĐĂNG KÝ / OTP ---
        function switchTab(tab) {
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('tabRegister').classList.remove('active');
            document.getElementById('formLogin').style.display = 'none';
            document.getElementById('formRegister').style.display = 'none';
            if(tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('formLogin').style.display = 'block';
            } else {
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('formRegister').style.display = 'block';
            }
        }

        // Gửi lại mã OTP
        function sendOTP() {
            var phone = document.getElementById('regPhone').value;
            if(phone.length < 9) { alert("Hãy nhập số điện thoại trước khi nhận mã!"); return; }
            var btn = document.getElementById('btnOTP');
            btn.innerText = "Đã gửi!";
            btn.style.background = "#27ae60";
            
            // Giả lập sau 5 giây cho phép gửi lại
            setTimeout(() => {
                btn.innerText = "Gửi lại mã";
                btn.style.background = "#FF416C";
            }, 5000); 
        }

        function doLogin() { enterMainApp(); }

        function doRegister() {
            let otp = document.getElementById('regOTP').value;
            if(otp === "") { alert("Vui lòng nhập mã xác nhận (OTP)!"); return; }
            alert("Đăng ký thành công!");
            enterMainApp();
        }

        function enterMainApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        // --- 3. BẢN ĐỒ VỆ TINH ---
        var map = L.map('map', { zoomControl: false }).setView([21.0028, 105.5244], 15);
        L.tileLayer('http://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        var routingControl = null;
        var pickupMarker = null;

        function calculateRoute() {
            var pickupVal = document.getElementById('pickup').value;
            var dropoffVal = document.getElementById('dropoff').value;
            var infoBox = document.getElementById('info-box');
            var btnBook = document.getElementById('btnBook');

            if (!pickupVal || !dropoffVal) {
                infoBox.style.display = 'none';
                btnBook.style.display = 'none';
                if (routingControl) map.removeControl(routingControl);
                return;
            }

            const drawMapRoute = (pLat, pLng, dLat, dLng) => {
                if (routingControl) map.removeControl(routingControl);
                if (pickupMarker) map.removeLayer(pickupMarker);

                var icon = L.divIcon({ html: '🟢', className: '', iconSize: [25, 25] });
                pickupMarker = L.marker([pLat, pLng], {icon: icon}).addTo(map).bindPopup("Điểm đón của bạn").openPopup();

                routingControl = L.Routing.control({
                    waypoints: [ L.latLng(pLat, pLng), L.latLng(dLat, dLng) ],
                    lineOptions: { styles: [{ color: '#00C9FF', opacity: 0.9, weight: 6 }] },
                    routeWhileDragging: false, addWaypoints: false, fitSelectedRoutes: true, show: false
                }).addTo(map);

                routingControl.on('routesfound', function(e) {
                    var distanceKm = (e.routes[0].summary.totalDistance / 1000).toFixed(1);
                    var price = 15000; 
                    if(distanceKm > 2) price += Math.ceil(distanceKm - 2) * 5000;

                    infoBox.style.display = 'block';
                    btnBook.style.display = 'block';
                    document.getElementById('distance-km').innerText = distanceKm;
                    document.getElementById('fare-price').innerText = price.toLocaleString('vi-VN') + ' đ';
                });
            };

            var dropCoords = dropoffVal.split(',');
            var dLat = parseFloat(dropCoords[0]);
            var dLng = parseFloat(dropCoords[1]);

            if (pickupVal === 'gps') {
                btnBook.innerText = "ĐANG LẤY TỌA ĐỘ GPS...";
                btnBook.style.display = 'block';
                btnBook.style.background = "#f39c12";

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            btnBook.innerText = "ĐẶT XE NGAY";
                            btnBook.style.background = "linear-gradient(90deg, #FF416C 0%, #FF4B2B 100%)";
                            drawMapRoute(position.coords.latitude, position.coords.longitude, dLat, dLng);
                        },
                        () => {
                            alert("Bạn chưa cấp quyền Vị trí cho trình duyệt!");
                            document.getElementById('pickup').value = ""; 
                            btnBook.style.display = 'none';
                        }
                    );
                }
            } else {
                var pickupCoords = pickupVal.split(',');
                drawMapRoute(parseFloat(pickupCoords[0]), parseFloat(pickupCoords[1]), dLat, dLng);
            }
        }

        // --- 4. HIỆU ỨNG CÁ SẤU ĐỚP CÁ KHI ĐẶT XE ---
        function triggerCrocAnimation() {
            var animScreen = document.getElementById('crocAnimScreen');
            var croc = document.getElementById('animCroc');
            var fish = document.getElementById('animFish');
            
            // Hiện lớp nền tối
            animScreen.style.display = 'block';
            croc.style.bottom = '-150px'; 
            fish.style.display = 'block'; 
            
            // Cá sấu nhảy lên
            setTimeout(() => {
                croc.style.bottom = '35%'; 
            }, 100);

            // Đớp cá (Cá biến mất, icon cá sấu thay đổi)
            setTimeout(() => {
                fish.style.display = 'none'; 
                croc.innerHTML = '🐊💦';
            }, 400);

            // Cá sấu rơi xuống
            setTimeout(() => {
                croc.style.bottom = '-150px'; 
            }, 800);

            // Ẩn hoạt ảnh và báo thành công
            setTimeout(() => {
                animScreen.style.display = 'none';
                croc.innerHTML = '🐊'; // reset icon
                alert('Đã chốt đơn! Tài xế Lê Văn Trường đang lao đến 🏍️💨');
            }, 1200);
        }
    </script>
</body>
</html>
