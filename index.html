<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xe Ôm Trường Lê - Bản Vệ Tinh VIP</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');
        
        body { 
            font-family: 'Quicksand', sans-serif; margin: 0; 
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); 
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .petal {
            position: absolute; top: -10px; font-size: 18px; pointer-events: none;
            animation: fall linear infinite, sway ease-in-out infinite alternate;
            z-index: 9999; will-change: transform;
        }
        @keyframes fall { to { transform: translateY(110vh); } }
        @keyframes sway { from { margin-left: -15px; } to { margin-left: 15px; } }

        .mobile-frame { 
            width: 100%; max-width: 420px; background: #fff; height: 100vh; 
            display: none; flex-direction: column; position: relative; z-index: 100; overflow: hidden;
        }

        .header {
            background: rgba(0, 0, 0, 0.9); color: #00C9FF; padding: 15px;
            text-align: center; font-size: 20px; font-weight: 700; z-index: 10; border-bottom: 2px solid #00C9FF;
        }
        .header span { font-size: 12px; display: block; font-weight: 500; color: #fff; }

        #map { flex: 1; width: 100%; z-index: 1; background: #e5e3df; }

        .booking-panel { 
            position: absolute; bottom: 0; width: 100%; 
            background: rgba(25, 25, 35, 0.95); padding: 25px 20px; 
            border-top: 2px solid #00C9FF; border-top-left-radius: 25px; border-top-right-radius: 25px;
            box-sizing: border-box; z-index: 10; color: white; max-height: 85vh; overflow-y: auto;
        }
        .booking-panel::-webkit-scrollbar { width: 4px; }
        .booking-panel::-webkit-scrollbar-thumb { background: #00C9FF; border-radius: 5px; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-weight: 700; color: #00C9FF; margin-bottom: 5px;}
        .input-group select, .input-group input { 
            width: 100%; padding: 12px; background: #1a1a2e; color: white;
            border: 1px solid #00C9FF; border-radius: 12px; font-size: 15px; font-family: 'Quicksand'; outline: none; box-sizing: border-box;
        }

        .price-box { 
            display: none; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 10px; border-radius: 12px; margin-bottom: 10px; text-align: center; color: #fff; 
        }
        .price-box p { margin: 0; font-size: 14px; font-weight: 700; }
        .price-text { font-size: 24px; font-weight: 700; margin-top: 5px; }

        .btn-book { 
            width: 100%; padding: 15px; background: linear-gradient(90deg, #FF416C 0%, #FF4B2B 100%); 
            color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; margin-bottom: 10px;
        }
        .btn-history {
            width: 100%; padding: 12px; background: transparent; border: 1px solid #00C9FF;
            color: #00C9FF; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
        }

        .zalo-btn {
            position: absolute; bottom: 350px; right: 15px; width: 50px; height: 50px;
            background-color: #0068FF; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 900; font-size: 12px; text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 104, 255, 0.5); z-index: 1000; animation: pulseZalo 2s infinite;
        }
        @keyframes pulseZalo { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* CÁ SẤU ĐỚP CÁ */
        #crocAnimScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; display: none; }
        #animFish { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); font-size: 60px; animation: fishDangle 0.5s infinite alternate; }
        @keyframes fishDangle { from {transform: translateX(-50%) rotate(-15deg);} to {transform: translateX(-50%) rotate(15deg);} }
        #animCroc { position: absolute; bottom: -150px; left: 50%; transform: translateX(-50%); font-size: 100px; transition: bottom 0.2s ease-in; }

        /* MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ */
        .auth-container {
            width: 100%; max-width: 380px; margin: auto; background: rgba(25, 25, 35, 0.95); 
            padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            border: 1px solid #00C9FF; z-index: 100; color: white; box-sizing: border-box;
            max-height: 90vh; overflow-y: auto;
        }
        .auth-container::-webkit-scrollbar { width: 6px; }
        .auth-container::-webkit-scrollbar-thumb { background: #00C9FF; border-radius: 10px; }

        .auth-header { text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 20px; color: #00C9FF; }
        .auth-tabs { display: flex; margin-bottom: 20px; border-radius: 10px; overflow: hidden; background: #1a1a2e; }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: 700; font-size: 14px; transition: 0.3s; }
        .auth-tab.active { background: #00C9FF; color: #000; }
        
        .auth-form input {
            width: 100%; padding: 12px; margin-bottom: 12px; background: #1a1a2e; 
            border: 1px solid #555; border-radius: 10px; color: white; font-size: 15px; box-sizing: border-box; outline: none;
        }
        .btn-auth { width: 100%; padding: 15px; background: #00C9FF; color: #000; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }

        /* MÀN HÌNH QUẢN TRỊ ADMIN & LỊCH SỬ KHÁCH HÀNG */
        #adminApp, #customerHistoryApp { 
            display: none; width: 100%; max-width: 420px; background: #1a1a2e; height: 100vh; 
            flex-direction: column; color: white; position: relative; z-index: 200; 
        }
        .admin-header { background: #FF416C; padding: 20px; text-align: center; font-weight: 700; font-size: 20px; position: relative;}
        .history-header { background: #00C9FF; color: #000; padding: 20px; text-align: center; font-weight: 700; font-size: 20px; position: relative;}
        .close-btn { position: absolute; left: 15px; top: 20px; font-size: 16px; cursor: pointer; font-weight: bold;}
        
        .order-list { padding: 20px; overflow-y: auto; flex: 1; }
        .order-card { background: #2a2a4a; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid #00C9FF; font-size: 14px;}
        .order-card h4 { margin: 0 0 10px 0; color: #00C9FF; font-size: 16px; display: flex; justify-content: space-between;}
        .order-card p { margin: 5px 0; }
        .order-card .status { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; margin-top: 5px;}
        .status-waiting { background: #f39c12; color: #fff; }
        .status-accepted { background: #38ef7d; color: #000; }
        .status-cancelled { background: #e74c3c; color: #fff; }
        .order-card .price { color: #38ef7d; font-weight: 700; font-size: 16px; margin-top: 10px; }
        
        .action-btn { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%;}
        .accept-btn { background: #38ef7d; color: #000; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%;}
        
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <!-- KHUNG ĐĂNG NHẬP CHUNG -->
    <div class="auth-container" id="authScreen">
        <div class="auth-header">🚀 HỆ THỐNG XE ÔM</div>
        <div class="auth-tabs">
            <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Khách Hàng</div>
            <div class="auth-tab" id="tabRegister" onclick="switchTab('register')">Đăng Ký</div>
            <div class="auth-tab" id="tabAdmin" onclick="switchTab('admin')">Admin</div>
        </div>

        <div class="auth-form" id="formLogin">
            <input type="text" id="loginUser" placeholder="Số điện thoại hoặc Email">
            <input type="password" id="loginPass" placeholder="Mật khẩu">
            <button class="btn-auth" onclick="doLogin()">VÀO ĐẶT XE</button>
        </div>

        <div class="auth-form" id="formRegister" style="display: none;">
            <input type="text" id="regName" placeholder="Họ và tên">
            <input type="tel" id="regPhone" placeholder="Số điện thoại">
            <input type="email" id="regEmail" placeholder="Email">
            
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <input type="text" id="regOTP" placeholder="Mã xác nhận OTP" style="margin-bottom: 0; flex: 1;">
                <button id="btnOTP" style="background: #0068FF; color: white; border: none; border-radius: 10px; padding: 0 12px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 13px;" onclick="sendOTPZalo()">Nhận mã Zalo</button>
            </div>
            
            <input type="password" id="regPass" placeholder="Mật khẩu">
            <input type="password" id="regConfirmPass" placeholder="Xác nhận lại mật khẩu">
            <button class="btn-auth" onclick="doRegister()">TẠO TÀI KHOẢN</button>
        </div>

        <div class="auth-form" id="formAdmin" style="display: none;">
            <div style="text-align: center; margin-bottom: 15px; color: #FF416C; font-weight: bold;">Khu vực cấm: Chỉ dành cho Chủ Sở Hữu</div>
            <input type="text" id="adminUser" placeholder="SĐT: 0373208633 hoặc Email Admin">
            <input type="password" id="adminPass" placeholder="Mật khẩu bí mật">
            <button class="btn-auth" style="background: #FF416C; color: white;" onclick="doAdminLogin()">VÀO TRANG QUẢN LÝ</button>
        </div>
    </div>

    <!-- MÀN HÌNH QUẢN TRỊ ADMIN (LÊ VĂN TRƯỜNG) -->
    <div id="adminApp">
        <div class="admin-header">TỔNG ĐÀI NHẬN CUỐC<br><span style="font-size: 14px; font-weight: normal;">Tài xế: Lê Văn Trường</span></div>
        <div class="order-list" id="adminOrderList"></div>
        <button class="btn-auth" style="margin: 20px; width: calc(100% - 40px); background: #555; color: white;" onclick="location.reload()">Đăng xuất</button>
    </div>

    <!-- MÀN HÌNH XEM LỊCH SỬ ĐẶT XE (KHÁCH HÀNG) -->
    <div id="customerHistoryApp">
        <div class="history-header">
            <span class="close-btn" onclick="closeHistory()">❮ Quay lại</span>
            CUỐC XE CỦA BẠN
        </div>
        <div class="order-list" id="customerOrderList"></div>
    </div>

    <!-- MÀN HÌNH KHÁCH HÀNG ĐẶT XE CHÍNH -->
    <div class="mobile-frame" id="mainApp">
        <div class="header">
            🚀 BẢN ĐỒ VỆ TINH VIP
            <span>Chủ sở hữu: Lê Văn Trường</span>
        </div>

        <div id="map"></div>

        <div id="crocAnimScreen">
            <div id="animFish">🐟</div>
            <div id="animCroc">🐊</div>
        </div>

        <a href="https://zaloapp.com/qr/p/qc0rgkdipkkf" target="_blank" class="zalo-btn">Zalo Hỗ Trợ</a>

        <div class="booking-panel" id="bookingPanel">
            <div class="input-group">
                <label>📍 Chọn điểm đón:</label>
                <select id="pickup" onchange="calculateRoute()">
                    <option value="">-- Chạm để chọn điểm đón --</option>
                    <option value="21.0028,105.5244">🏢 Kí túc xá B-C</option>
                    <option value="21.0050,105.5230">🎓 Trường Đại học Việt Nhật - Xã Hòa Lạc</option>
                    <option value="20.9900,105.5280">⛽ Cây xăng 239</option>
                    <option value="21.0045,105.5255">🏨 Nhà khách</option>
                    <option value="21.0060,105.5260">📚 Giảng đường HT1</option>
                    <option value="21.0062,105.5265">📚 Giảng đường HT2</option>
                    <option value="21.0064,105.5270">📚 Giảng đường HT3</option>
                    <option value="21.0066,105.5275">📚 Giảng đường HT4</option>
                    <option value="21.0040,105.5270">💻 Trường Đại học Công nghệ - xã Hòa Lạc</option>
                    <option value="21.0010,105.5200">🏛️ Cổng chính Đại học Quốc gia</option>
                    <option value="21.0015,105.5280">⛩️ Cổng phụ Đại học Quốc gia</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>🏁 Chọn điểm đến:</label>
                <select id="dropoff" onchange="calculateRoute()">
                    <option value="">-- Chạm để chọn nơi đến --</option>
                    <option value="21.0028,105.5244">🏢 Kí túc xá B-C</option>
                    <option value="21.0050,105.5230">🎓 Trường Đại học Việt Nhật - Xã Hòa Lạc</option>
                    <option value="20.9900,105.5280">⛽ Cây xăng 239</option>
                    <option value="21.0045,105.5255">🏨 Nhà khách</option>
                    <option value="21.0060,105.5260">📚 Giảng đường HT1</option>
                    <option value="21.0062,105.5265">📚 Giảng đường HT2</option>
                    <option value="21.0064,105.5270">📚 Giảng đường HT3</option>
                    <option value="21.0066,105.5275">📚 Giảng đường HT4</option>
                    <option value="21.0040,105.5270">💻 Trường Đại học Công nghệ - xã Hòa Lạc</option>
                    <option value="21.0010,105.5200">🏛️ Cổng chính Đại học Quốc gia</option>
                    <option value="21.0015,105.5280">⛩️ Cổng phụ Đại học Quốc gia</option>
                </select>
            </div>

            <!-- Thêm ô ghi chú -->
            <div class="input-group">
                <label>📝 Ghi chú cho tài xế:</label>
                <input type="text" id="orderNote" placeholder="Ví dụ: Đợi em ở cổng sau nhé...">
            </div>

            <div id="info-box" class="price-box">
                <p>Khoảng cách: <span id="distance-km">0</span> km</p>
                <div class="price-text" id="fare-price">0 đ</div>
            </div>

            <button class="btn-book" id="btnBook" onclick="triggerCrocAnimation()" style="display: none;">ĐẶT XE NGAY</button>
            <button class="btn-history" onclick="openCustomerHistory()">Xem cuốc đã đặt</button>
        </div>
    </div>

    <script>
        // --- HOA ĐÀO RƠI ---
        function createPetals() {
            const petal = document.createElement('div');
            petal.innerHTML = '🌸';
            petal.classList.add('petal');
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = (Math.random() * 2 + 3) + 's, ' + (Math.random() * 2 + 1) + 's';
            document.body.appendChild(petal);
            setTimeout(() => { petal.remove(); }, 5000);
        }
        setInterval(createPetals, 600);

        let currentCustomerName = "Khách Hàng";
        let currentCustomerPhone = "";
        let currentPrice = 0;

        // --- XỬ LÝ ĐĂNG NHẬP / ĐĂNG KÝ ---
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('formLogin').style.display = 'none';
            document.getElementById('formRegister').style.display = 'none';
            document.getElementById('formAdmin').style.display = 'none';
            
            if(tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('formLogin').style.display = 'block';
            } else if(tab === 'register') {
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('formRegister').style.display = 'block';
            } else {
                document.getElementById('tabAdmin').classList.add('active');
                document.getElementById('formAdmin').style.display = 'block';
            }
        }

        function sendOTPZalo() {
            var phone = document.getElementById('regPhone').value;
            if(phone.length < 9) { alert("Hãy nhập số điện thoại để nhận mã Zalo!"); return; }
            alert("Đã gửi mã OTP đến Zalo!");
            var btn = document.getElementById('btnOTP');
            btn.innerText = "Đã gửi!"; btn.style.background = "#27ae60";
            setTimeout(() => { btn.innerText = "Gửi lại"; btn.style.background = "#0068FF"; }, 5000); 
        }

        function doLogin() { 
            let user = document.getElementById('loginUser').value.trim();
            let pass = document.getElementById('loginPass').value;
            if(!user || !pass) { alert("Vui lòng nhập tài khoản và mật khẩu!"); return; }
            currentCustomerPhone = user;
            enterMainApp(); 
        }

        function doRegister() {
            currentCustomerName = document.getElementById('regName').value.trim();
            currentCustomerPhone = document.getElementById('regPhone').value.trim();
            let email = document.getElementById('regEmail').value.trim();
            let otp = document.getElementById('regOTP').value.trim();
            let pass = document.getElementById('regPass').value;
            let confirmPass = document.getElementById('regConfirmPass').value;

            if(!currentCustomerName || !currentCustomerPhone || !email || !pass) {
                alert("Vui lòng điền đầy đủ tất cả thông tin!"); return;
            }
            if(pass !== confirmPass) { alert("Mật khẩu xác nhận không trùng khớp!"); return; }
            if(!otp) { alert("Vui lòng nhập mã xác nhận (OTP) Zalo!"); return; }
            
            alert("Đăng ký thành công tài khoản: " + currentCustomerName);
            enterMainApp();
        }

        function enterMainApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        // --- BẢO MẬT ADMIN LÊ VĂN TRƯỜNG ---
        function doAdminLogin() {
            let user = document.getElementById('adminUser').value.trim();
            let pass = document.getElementById('adminPass').value;
            
            if ((user === "0373208633" || user === "lvantruong12072007@gmail.com") && pass === "30122004") {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('adminApp').style.display = 'flex';
                renderAdminOrders();
            } else {
                alert("❌ TRUY CẬP BỊ TỪ CHỐI!\nBạn không phải chủ sở hữu Lê Văn Trường. Mọi hành vi xâm nhập trái phép đều bị hệ thống ghi nhận.");
            }
        }

        // --- LOGIC ĐƠN HÀNG (TRẠNG THÁI, THỜI GIAN, HỦY, NHẬN) ---
        function getStatusClass(status) {
            if(status === "Đang tìm tài xế") return "status-waiting";
            if(status === "Tài xế đang đến") return "status-accepted";
            return "status-cancelled";
        }

        function renderAdminOrders() {
            let orders = JSON.parse(localStorage.getItem('rideOrders')) || [];
            let list = document.getElementById('adminOrderList');
            if (orders.length === 0) {
                list.innerHTML = "<p style='text-align:center; color:#888;'>Chưa có khách nào đặt xe.</p>";
                return;
            }
            
            list.innerHTML = "";
            orders.reverse().forEach((order) => {
                let acceptBtn = order.status === "Đang tìm tài xế" 
                    ? `<button class="accept-btn" onclick="adminAcceptOrder(${order.id})">Tài xế Nhận Cuốc</button>` : "";
                
                let cancelInfo = order.cancelReason ? `<p style="color:#e74c3c;">⚠️ <b>Lý do hủy:</b> ${order.cancelReason}</p>` : "";

                list.innerHTML += `
                    <div class="order-card">
                        <h4>Mã đơn: #${order.id} <span class="status ${getStatusClass(order.status)}">${order.status}</span></h4>
                        <p>🕒 <b>Thời gian:</b> ${order.time}</p>
                        <p>👤 <b>Khách hàng:</b> ${order.name} - 📞 ${order.phone}</p>
                        <p>📍 <b>Đón:</b> ${order.pickup}</p>
                        <p>🏁 <b>Đến:</b> ${order.dropoff}</p>
                        <p>📝 <b>Ghi chú:</b> ${order.note || "Không có"}</p>
                        ${cancelInfo}
                        <div class="price">💰 ${order.price} đ</div>
                        ${acceptBtn}
                    </div>
                `;
            });
        }

        function adminAcceptOrder(orderId) {
            let orders = JSON.parse(localStorage.getItem('rideOrders')) || [];
            let index = orders.findIndex(o => o.id === orderId);
            if(index !== -1) {
                orders[index].status = "Tài xế đang đến";
                localStorage.setItem('rideOrders', JSON.stringify(orders));
                renderAdminOrders();
            }
        }

        function openCustomerHistory() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('customerHistoryApp').style.display = 'flex';
            
            let orders = JSON.parse(localStorage.getItem('rideOrders')) || [];
            // Lọc ra đúng đơn của số điện thoại/email đang đăng nhập
            let myOrders = orders.filter(o => o.phone === currentCustomerPhone);
            let list = document.getElementById('customerOrderList');
            
            if (myOrders.length === 0) {
                list.innerHTML = "<p style='text-align:center; color:#888;'>Bạn chưa đặt cuốc xe nào.</p>";
                return;
            }

            list.innerHTML = "";
            myOrders.reverse().forEach((order) => {
                let cancelBtn = (order.status === "Đang tìm tài xế" || order.status === "Tài xế đang đến") 
                    ? `<button class="action-btn" onclick="customerCancelOrder(${order.id})">Hủy cuốc</button>` : "";
                let cancelInfo = order.cancelReason ? `<p style="color:#e74c3c;">⚠️ <b>Lý do hủy:</b> ${order.cancelReason}</p>` : "";

                list.innerHTML += `
                    <div class="order-card">
                        <h4>Mã đơn: #${order.id} <span class="status ${getStatusClass(order.status)}">${order.status}</span></h4>
                        <p>🕒 <b>Thời gian:</b> ${order.time}</p>
                        <p>📍 <b>Đón:</b> ${order.pickup}</p>
                        <p>🏁 <b>Đến:</b> ${order.dropoff}</p>
                        <p>📝 <b>Ghi chú:</b> ${order.note || "Không có"}</p>
                        ${cancelInfo}
                        <div class="price">💰 ${order.price} đ</div>
                        ${cancelBtn}
                    </div>
                `;
            });
        }

        function closeHistory() {
            document.getElementById('customerHistoryApp').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        function customerCancelOrder(orderId) {
            let reason = prompt("⚠️ Vui lòng nhập lý do bạn muốn hủy cuốc xe này:");
            if (reason === null || reason.trim() === "") {
                alert("Bạn phải nhập lý do để hủy cuốc!"); return;
            }
            
            let orders = JSON.parse(localStorage.getItem('rideOrders')) || [];
            let index = orders.findIndex(o => o.id === orderId);
            if(index !== -1) {
                orders[index].status = "Đã hủy";
                orders[index].cancelReason = reason;
                localStorage.setItem('rideOrders', JSON.stringify(orders));
                alert("Đã hủy cuốc thành công!");
                openCustomerHistory(); // Tải lại giao diện lịch sử
            }
        }

        // --- BẢN ĐỒ VỆ TINH ---
        var map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([21.0028, 105.5244], 15);
        L.tileLayer('http://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        var routingControl = null;
        var pickupMarker = null;

        function calculateRoute() {
            var pickupSel = document.getElementById('pickup');
            var dropoffSel = document.getElementById('dropoff');
            var infoBox = document.getElementById('info-box');
            var btnBook = document.getElementById('btnBook');

            if (!pickupSel.value || !dropoffSel.value) {
                infoBox.style.display = 'none';
                btnBook.style.display = 'none';
                if (routingControl) map.removeControl(routingControl);
                return;
            }

            if (routingControl) map.removeControl(routingControl);
            if (pickupMarker) map.removeLayer(pickupMarker);

            var pCoords = pickupSel.value.split(',');
            var dCoords = dropoffSel.value.split(',');
            var pLat = parseFloat(pCoords[0]), pLng = parseFloat(pCoords[1]);
            var dLat = parseFloat(dCoords[0]), dLng = parseFloat(dCoords[1]);

            var icon = L.divIcon({ html: '🟢', className: '', iconSize: [25, 25] });
            pickupMarker = L.marker([pLat, pLng], {icon: icon}).addTo(map).bindPopup("Điểm đón").openPopup();

            routingControl = L.Routing.control({
                waypoints: [ L.latLng(pLat, pLng), L.latLng(dLat, dLng) ],
                lineOptions: { styles: [{ color: '#00C9FF', opacity: 0.9, weight: 5 }] },
                routeWhileDragging: false, addWaypoints: false, fitSelectedRoutes: true, show: false
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                var distanceKm = (e.routes[0].summary.totalDistance / 1000).toFixed(1);
                var price = 15000; 
                if(distanceKm > 2) price += Math.ceil(distanceKm - 2) * 5000;
                
                currentPrice = price; 
                infoBox.style.display = 'block';
                btnBook.style.display = 'block';
                document.getElementById('distance-km').innerText = distanceKm;
                document.getElementById('fare-price').innerText = price.toLocaleString('vi-VN') + ' đ';
            });
        }

        // --- ĐẶT XE & LƯU TRỮ ---
        function triggerCrocAnimation() {
            var animScreen = document.getElementById('crocAnimScreen');
            var croc = document.getElementById('animCroc');
            var fish = document.getElementById('animFish');
            
            animScreen.style.display = 'block';
            croc.style.bottom = '-150px'; fish.style.display = 'block'; 
            
            setTimeout(() => { croc.style.bottom = '35%'; }, 100);
            setTimeout(() => { fish.style.display = 'none'; croc.innerHTML = '🐊💦'; }, 400);
            setTimeout(() => { croc.style.bottom = '-150px'; }, 800);

            setTimeout(() => {
                animScreen.style.display = 'none';
                croc.innerHTML = '🐊'; 
                
                var pickupText = document.getElementById('pickup').options[document.getElementById('pickup').selectedIndex].text;
                var dropoffText = document.getElementById('dropoff').options[document.getElementById('dropoff').selectedIndex].text;
                var noteText = document.getElementById('orderNote').value.trim();
                
                let now = new Date();
                let timeString = now.toLocaleTimeString('vi-VN') + " - " + now.toLocaleDateString('vi-VN');

                let orders = JSON.parse(localStorage.getItem('rideOrders')) || [];
                orders.push({
                    id: Math.floor(Math.random() * 9000) + 1000, // Tạo mã đơn ngẫu nhiên 4 số
                    time: timeString,
                    name: currentCustomerName,
                    phone: currentCustomerPhone || "Chưa nhập SĐT",
                    pickup: pickupText,
                    dropoff: dropoffText,
                    note: noteText,
                    price: currentPrice.toLocaleString('vi-VN'),
                    status: "Đang tìm tài xế",
                    cancelReason: ""
                });
                localStorage.setItem('rideOrders', JSON.stringify(orders));

                alert('Đặt cuốc thành công! Bạn có thể xem trạng thái đơn ở mục "Xem cuốc đã đặt".');
                
                // Reset form đặt xe
                document.getElementById('pickup').value = "";
                document.getElementById('dropoff').value = "";
                document.getElementById('orderNote').value = "";
                calculateRoute();
                
            }, 1200);
        }
    </script>
</body>
</html>
